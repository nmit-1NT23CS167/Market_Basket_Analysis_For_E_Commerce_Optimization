<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
  font-family: Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#f2f2f2;
}

.box{
  background:white;
  padding:30px;
  border-radius:12px;
  width:280px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

input{
  width:90%;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  background:green;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.toggle{
  margin-top:10px;
  color:blue;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2 id="title">Login</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="handle()">Login</button>

<p class="toggle" onclick="toggle()">No account? Create one</p>
</div>

<script>
let isLogin = true;

function toggle(){
  isLogin = !isLogin;
  document.getElementById("title").innerText = isLogin ? "Login" : "Signup";
  document.querySelector("button").innerText = isLogin ? "Login" : "Signup";
}

function handle(){
  let u = user.value;
  let p = pass.value;

  let users = JSON.parse(localStorage.getItem("users")) || {};

  if(isLogin){
    if(users[u] === p){
      localStorage.setItem("user", u);
      location = "index.html";
    } else alert("Invalid");
  } else {
    users[u] = p;
    localStorage.setItem("users", JSON.stringify(users));
    alert("Account created");
    toggle();
  }
}
</script>

</body>
</html>
